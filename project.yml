name: DouyinDL
options:
  bundleIdPrefix: com.hh
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DouyinDL:
    type: application
    platform: iOS
    sources:
      - path: DouyinDL
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hh.douyindl
        PRODUCT_NAME: DouyinDL
        INFOPLIST_FILE: DouyinDL/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"

schemes:
  DouyinDL:
    build:
      targets:
        DouyinDL: all
    run:
      config: Debug
